(() => {
  try {
    const savedTheme = localStorage.getItem('mol-future-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
      document.documentElement.dataset.theme = savedTheme;
      document.querySelector('#theme-color')?.setAttribute('content', savedTheme === 'dark' ? '#17171b' : '#f3eee4');
    } else if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      document.querySelector('#theme-color')?.setAttribute('content', '#17171b');
    }
  } catch (_) {}
})();
</script><title>Museum of Ordinary Life / Possible Future</title><link rel="stylesheet" href="assets/css/base.css"><link rel="stylesheet" href="assets/css/future-components.css"><link rel="stylesheet" href="assets/css/future-theme.css"><link rel="stylesheet" href="assets/css/enhancements.css"></head><body id="top">
